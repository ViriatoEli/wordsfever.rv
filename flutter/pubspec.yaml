name: words_fever
description: Words Fever — Il party game definitivo. Progetto 4I 2026.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  google_fonts: ^6.2.1
  confetti: ^0.7.0
  sensors_plus: ^5.0.0
  audioplayers: ^6.6.0
  http: ^1.6.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
